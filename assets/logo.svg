<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="100%" height="100%">
  <defs>
    <linearGradient id="wingTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc0a1e"/>
      <stop offset="100%" stop-color="#8a0010"/>
    </linearGradient>
    <linearGradient id="wingMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e01025"/>
      <stop offset="100%" stop-color="#9a0015"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#cc1020"/>
      <stop offset="100%" stop-color="#7a0010"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dd1020"/>
      <stop offset="100%" stop-color="#880010"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e01525"/>
      <stop offset="100%" stop-color="#8a0010"/>
    </linearGradient>
  </defs>

  <!-- ===================== HAWK ICON ===================== -->
  <!-- Positioned center, scale to ~380px wide -->
  <g transform="translate(210, 10)">

    <!-- === WING: Upper primary feather (topmost, largest sweep) === -->
    <path d="M 60,170
             C 50,130 55,90 80,60
             C 105,30 145,10 190,5
             C 230,1 265,12 285,35
             C 260,20 225,15 190,20
             C 155,25 118,45 90,75
             C 70,100 62,138 60,170 Z"
          fill="url(#wingTop)"/>

    <!-- === WING: Second feather layer === -->
    <path d="M 65,195
             C 55,160 62,122 85,96
             C 108,70 148,52 190,48
             C 225,44 258,56 278,78
             C 252,60 220,52 188,57
             C 155,62 122,80 98,108
             C 76,134 67,165 65,195 Z"
          fill="url(#wingMid)"/>

    <!-- === WING: Third feather layer (lowest) === -->
    <path d="M 72,220
             C 64,188 72,155 94,132
             C 116,108 152,93 190,90
             C 222,88 252,100 270,122
             C 246,104 216,96 186,100
             C 154,105 124,122 102,148
             C 82,172 73,197 72,220 Z"
          fill="url(#wingTop)"/>

    <!-- White highlight lines between feathers (light separators) -->
    <!-- Between feather 1 and 2 -->
    <path d="M 83,80 C 118,46 168,22 218,16"
          stroke="rgba(255,255,255,0.55)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Between feather 2 and 3 -->
    <path d="M 90,108 C 126,78 172,58 218,52"
          stroke="rgba(255,255,255,0.45)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Between feather 3 and body -->
    <path d="M 100,140 C 134,114 176,98 216,94"
          stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- === BODY / CHEST — connects wing to head === -->
    <!-- Main body shape -->
    <path d="M 270,122
             C 290,110 315,108 338,118
             C 355,126 368,140 370,158
             C 372,178 360,194 340,200
             C 318,206 300,196 290,182
             C 282,170 282,155 290,145
             C 270,155 255,175 256,200
             C 258,225 275,248 300,260
             C 280,258 258,248 248,232
             C 235,212 235,185 248,165
             C 256,150 263,134 270,122 Z"
          fill="url(#bodyGrad)"/>

    <!-- === BAR CHART (3 rising bars, hawk body area) === -->
    <!-- Bar 1 (shortest, leftmost) -->
    <rect x="200" y="220" width="22" height="55" rx="3" fill="url(#barGrad)"/>
    <!-- Bar 2 (medium) -->
    <rect x="228" y="196" width="22" height="79" rx="3" fill="url(#barGrad)"/>
    <!-- Bar 3 (tallest, rightmost) -->
    <rect x="256" y="168" width="22" height="107" rx="3" fill="url(#barGrad)"/>

    <!-- === SWOOSH / sweep curve under body === -->
    <path d="M 80,245
             C 130,255 200,258 270,248
             C 310,242 348,228 375,210
             C 345,232 306,248 264,254
             C 210,262 148,256 80,245 Z"
          fill="url(#wingTop)" opacity="0.85"/>

    <!-- === HAWK HEAD (facing right) === -->
    <path d="M 290,125
             C 310,112 338,110 360,120
             C 378,128 392,144 396,164
             C 400,186 390,208 372,218
             C 354,228 330,224 316,210
             C 305,200 302,186 308,174
             C 314,162 326,158 336,162
             C 328,158 318,162 314,172
             C 310,183 314,196 322,205
             C 308,198 298,182 295,165
             C 292,148 290,135 290,125 Z"
          fill="url(#headGrad)"/>

    <!-- Hawk head main solid fill -->
    <path d="M 300,120
             C 322,105 354,108 374,122
             C 394,136 402,158 396,180
             C 390,202 374,218 354,222
             C 334,226 316,214 308,198
             C 300,182 302,162 314,150
             C 318,145 324,142 330,142
             C 312,148 304,165 308,183
             C 312,200 328,212 346,212
             C 364,212 378,200 382,183
             C 386,165 378,146 364,136
             C 350,126 332,124 318,130
             Z"
          fill="url(#headGrad)"/>

    <!-- Simpler solid head shape -->
    <path d="M 305,118
             C 330,104 362,108 382,126
             C 400,144 404,170 392,192
             C 380,212 358,222 336,218
             C 316,214 300,198 296,178
             C 292,158 298,136 305,118 Z"
          fill="url(#headGrad)"/>

    <!-- Forehead crown / top of head detail -->
    <path d="M 320,105
             C 338,94 362,96 376,110
             C 358,100 336,100 320,105 Z"
          fill="#b00018"/>

    <!-- === EYE === -->
    <!-- Eye white/sclera -->
    <ellipse cx="366" cy="152" rx="10" ry="9" fill="white"/>
    <!-- Eye dark iris/pupil -->
    <ellipse cx="368" cy="153" rx="6" ry="6" fill="#1a0003"/>
    <!-- Eye highlight -->
    <circle cx="365" cy="150" r="2" fill="white" opacity="0.7"/>
    <!-- Eye brow ridge line above eye -->
    <path d="M 355,144 C 362,138 374,138 382,144"
          stroke="#7a0010" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- === BEAK === -->
    <path d="M 392,178
             C 408,178 420,186 422,196
             C 424,206 416,214 406,212
             C 396,210 390,202 392,194
             C 392,188 394,182 392,178 Z"
          fill="url(#headGrad)"/>
    <!-- Beak tip curve (lower mandible) -->
    <path d="M 406,196 C 416,196 422,204 418,210 C 414,216 406,214 404,208 Z"
          fill="#880010"/>

  </g>

  <!-- ===================== TYPOGRAPHY ===================== -->

  <!-- "RED" — bold, red, serif style -->
  <text x="118" y="590"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="115"
        font-weight="900"
        letter-spacing="2"
        fill="#cc0a1e">RED</text>

  <!-- "HAWK" — bold, dark charcoal, serif style -->
  <text x="370" y="590"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="115"
        font-weight="900"
        letter-spacing="2"
        fill="#1c1c1c">HAWK</text>

  <!-- Horizontal rule left -->
  <line x1="118" y1="618" x2="178" y2="618" stroke="#cc0a1e" stroke-width="3" stroke-linecap="round"/>
  <!-- "INVESTMENT" centered -->
  <text x="400" y="640"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="32"
        font-weight="600"
        letter-spacing="14"
        fill="#1c1c1c"
        text-anchor="middle">INVESTMENT</text>
  <!-- Horizontal rule right -->
  <line x1="622" y1="618" x2="682" y2="618" stroke="#cc0a1e" stroke-width="3" stroke-linecap="round"/>

</svg>
